name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu repondan indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java JDK 25 kur
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 3. Bağımlılıkları yükle ve projeyi derle
      - name: Build with Maven
        run: mvn clean package --batch-mode

      # 4. Testleri çalıştır
      - name: Run Tests
        run: mvn test --batch-mode
